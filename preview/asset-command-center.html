<title>Asset Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117; --panel:#161b22; --raised:#21262d; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --dim:#484f58;
  --teal:#009090; --coral:#E8734A; --gold:#D4A843;
  --green:#3fb950; --blue:#58a6ff; --red:#f85149;
  --display:"Cormorant Garamond",Georgia,serif;
  --ui:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:#444c56;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button{font-family:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;text-wrap:balance}

/* ── header ─────────────────────────────────────────── */
.hdr{
  position:sticky; top:0; z-index:200;
  background:rgba(13,17,23,.92); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border); padding:0 1.25rem;
}
.hdr-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mark{
  width:32px;height:32px;background:var(--teal);border-radius:7px;
  display:grid;place-items:center;position:relative;color:#fff;font-size:13px;
  box-shadow:0 0 12px rgba(0,144,144,.35);
}
.mark::after{
  content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;
  background:var(--gold);border-radius:50%;border:2px solid var(--bg);
}
.brand-t{font-family:var(--display);font-size:.95rem;font-weight:700;line-height:1.2}
.brand-s{font-size:.58rem;font-weight:600;color:var(--teal);letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:6px;padding:6px 13px;border:none;
  background:none;color:var(--muted);cursor:pointer;border-radius:7px;
  font-size:.78rem;font-weight:500;white-space:nowrap;transition:background .2s,color .2s;
}
.tab:hover{color:var(--text);background:var(--raised)}
.tab[aria-selected="true"]{background:var(--teal);color:#fff;box-shadow:0 0 16px rgba(0,144,144,.3)}
.badge-n{background:var(--coral);color:#fff;border-radius:20px;padding:1px 6px;font-size:.62rem;font-weight:700;font-family:var(--mono)}
.tab[aria-selected="true"] .badge-n{background:rgba(255,255,255,.25)}
.hdr-act{display:flex;gap:6px;flex-shrink:0}

/* ── buttons ────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:5px;padding:7px 13px;
  border:none;border-radius:6px;background:var(--raised);color:#c9d1d9;
  font-size:.8rem;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:filter .2s,background .2s,border-color .2s;
}
.btn:hover{filter:brightness(1.35)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn--sm{padding:5px 10px;font-size:.76rem}
.btn--xs{padding:3px 8px;font-size:.68rem}
.btn--teal{background:var(--teal);color:#fff}
.btn--outline{background:transparent;border:1px solid var(--border);color:#c9d1d9}
.btn--outline:hover{border-color:var(--teal);filter:none;background:rgba(0,144,144,.08)}
.btn--danger{background:#da3633;color:#fff}
.btn--ghost{background:none;color:var(--muted);padding:4px 8px}
.btn--ghost:hover{background:var(--raised);color:var(--text)}

/* ── shared chrome ──────────────────────────────────── */
main{max-width:1600px;margin:0 auto;padding:1.4rem 1.25rem 3rem}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;
  font-size:.64rem;font-weight:700;line-height:1.6;white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.aid{
  font-family:var(--mono);font-size:.67rem;font-weight:700;color:var(--teal);
  background:rgba(0,144,144,.15);padding:3px 8px;border-radius:5px;white-space:nowrap;
}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.15rem}
.sub{font-size:.76rem;color:var(--muted)}
.empty{padding:3rem 1rem;text-align:center;color:var(--dim);font-size:.85rem}
.input,.select{
  padding:7px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--raised);color:var(--text);font-family:var(--ui);font-size:.8rem;
  outline:none;transition:border-color .2s;
}
.input:focus,.select:focus{border-color:var(--teal)}
.select{cursor:pointer;font-size:.74rem;padding:6px 9px;color:#c9d1d9}
label.fld{display:flex;flex-direction:column;gap:4px}
label.fld > span{font-size:.64rem;font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}

/* ── pipeline ───────────────────────────────────────── */
.pipe{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:stretch}
.col{
  flex:0 0 288px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;display:flex;flex-direction:column;min-height:60vh;transition:border-color .2s,background .2s;
}
.col.over{border-color:var(--teal);background:rgba(0,144,144,.05)}
.col-h{
  display:flex;align-items:center;gap:8px;padding:11px 13px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);border-radius:10px 10px 0 0;
}
.col-t{font-size:.78rem;font-weight:600;flex:1}
.col-n{font-family:var(--mono);font-size:.7rem;color:var(--dim)}
.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.acard{
  background:var(--raised);border:1px solid var(--border);border-left:3px solid var(--teal);
  border-radius:8px;padding:10px 11px;cursor:grab;transition:transform .15s,box-shadow .15s,border-color .15s;
}
.acard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4);border-color:#484f58}
.acard:active{cursor:grabbing}
.acard.drag{opacity:.4}
.acard-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.acard-n{font-size:.82rem;font-weight:500;line-height:1.35;margin-bottom:8px;word-break:break-word}
.acard-f{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.star{background:none;border:none;cursor:pointer;font-size:.8rem;padding:0 2px;line-height:1;color:var(--dim)}
.star.on{color:var(--gold)}

/* ── stat tiles ─────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 15px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent,var(--teal))}
.tile-l{font-size:.62rem;font-weight:600;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.tile-v{font-family:var(--mono);font-size:1.6rem;font-weight:700;line-height:1;color:var(--accent,var(--text));font-variant-numeric:tabular-nums}
.tile-s{font-size:.7rem;color:var(--muted);margin-top:5px}
.bar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden;display:flex}
.bar > span{display:block;height:100%}

/* ── tables ─────────────────────────────────────────── */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.79rem;min-width:900px}
th{
  text-align:left;padding:9px 11px;background:var(--raised);color:var(--dim);
  font-size:.63rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--teal)}
td{padding:8px 11px;border-bottom:1px solid rgba(48,54,61,.6);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(0,144,144,.05)}
tbody tr.sel{background:rgba(0,144,144,.09)}
.nm{font-weight:500;cursor:pointer}
.nm:hover{color:var(--teal)}

/* ── multiply ───────────────────────────────────────── */
.mrow{display:grid;grid-template-columns:minmax(200px,1.6fr) repeat(6,minmax(52px,1fr)) 62px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid rgba(48,54,61,.6)}
.mrow:hover{background:rgba(0,144,144,.04)}
.mhead{font-size:.6rem;font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.mbox{
  aspect-ratio:1/1;max-height:38px;border:1px solid var(--border);border-radius:7px;background:var(--raised);
  cursor:pointer;display:grid;place-items:center;font-size:.9rem;transition:all .18s;color:var(--dim);
}
.mbox:hover{border-color:var(--teal)}
.mbox.on{background:rgba(0,144,144,.16);border-color:var(--teal);color:var(--teal)}

/* ── activity ───────────────────────────────────────── */
.act{display:flex;gap:11px;padding:10px 13px;border-bottom:1px solid rgba(48,54,61,.6);align-items:flex-start}
.act-i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:.75rem;flex-shrink:0}
.act-t{font-size:.8rem;font-weight:500}
.act-d{font-size:.72rem;color:var(--muted);margin-top:2px}
.act-ts{font-family:var(--mono);font-size:.66rem;color:var(--dim);white-space:nowrap;margin-left:auto;padding-left:8px}

/* ── drawer + modal ─────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:399;animation:fade .2s ease}
.drawer{
  position:fixed;top:0;right:0;height:100dvh;width:min(580px,100vw);
  background:var(--panel);border-left:1px solid var(--border);z-index:400;
  display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.7);
  animation:slide .28s cubic-bezier(.4,0,.2,1);
}
.dr-h{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);background:var(--raised);flex-shrink:0}
.dr-t{font-family:var(--display);font-size:1.05rem;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.dr-tab{
  flex:1;min-width:72px;padding:9px 6px;border:none;background:none;cursor:pointer;
  font-size:.72rem;font-weight:500;color:var(--dim);text-transform:capitalize;
  border-bottom:2px solid transparent;transition:color .2s,border-color .2s;
}
.dr-tab:hover{color:var(--text)}
.dr-tab[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
.dr-b{padding:16px;overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 12px;font-size:.79rem;align-items:baseline}
.kv dt{color:var(--dim);font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.kv dd{margin:0}
pre.code{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;
  overflow:auto;max-height:420px;font-family:var(--mono);font-size:.7rem;line-height:1.6;color:#c9d1d9;margin:0;
}
.modal-w{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:500;display:grid;place-items:center;padding:1rem;animation:fade .2s ease}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:min(720px,100%);max-height:90dvh;display:flex;flex-direction:column;box-shadow:0 16px 56px rgba(0,0,0,.7)}
.modal-h{display:flex;align-items:center;gap:10px;padding:1.05rem 1.25rem;border-bottom:1px solid var(--border)}
.modal-b{padding:1.15rem 1.25rem;overflow-y:auto;flex:1}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:.85rem 1.25rem;border-top:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
.err{color:var(--red);font-size:.66rem}
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;background:var(--raised);color:var(--text);
  padding:11px 16px;border-radius:8px;font-size:.8rem;font-weight:500;z-index:9000;
  border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:360px;
  animation:up .25s ease;
}
.drop{
  display:block;border:2px dashed rgba(0,144,144,.4);border-radius:16px;padding:2.5rem 2rem;
  text-align:center;cursor:pointer;background:rgba(0,144,144,.03);transition:background .2s,border-color .2s;
}
.drop:hover,.drop.over{background:rgba(0,144,144,.09);border-color:var(--teal)}
.ring-t{font-family:var(--mono);font-size:.58rem;font-weight:700}
.note-in{width:100%;background:var(--bg);border:1px solid var(--teal);border-radius:5px;color:var(--text);font-family:var(--ui);font-size:.76rem;padding:4px 7px;outline:none}
.banner{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;margin-bottom:14px;
  background:rgba(0,144,144,.07);border:1px solid rgba(0,144,144,.22);border-radius:9px;
  font-size:.74rem;color:#9fd6d6;
}
@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:720px){
  .grid2{grid-template-columns:1fr}.span2{grid-column:span 1}
  .hdr-act .lbl{display:none}
  main{padding:1rem .75rem 3rem}
}
</style>

<header class="hdr">
  <div class="hdr-in">
    <div class="brand">
      <div class="mark" aria-hidden="true">⚡</div>
      <div>
        <div class="brand-t">Muscle-Meta Matrix™</div>
        <div class="brand-s">Command Center v3</div>
      </div>
    </div>
    <nav class="nav" id="nav" role="tablist" aria-label="Dashboard sections"></nav>
    <div class="hdr-act">
      <button class="btn btn--sm btn--outline" data-act="export-csv">CSV</button>
      <button class="btn btn--sm btn--outline" data-act="export-json">JSON</button>
      <button class="btn btn--sm btn--teal" data-act="new"><span aria-hidden="true">+</span> <span class="lbl">New Asset</span></button>
    </div>
  </div>
</header>

<main>
  <div class="banner">
    <strong style="color:var(--teal)">Interactive preview</strong>
    <span>Drag cards between stages, add assets, toggle formats — stats and the activity log update live. Changes save in this browser only; the real app persists to Convex.</span>
    <button class="btn btn--xs btn--outline" data-act="reset" style="margin-left:auto">Reset to 47 seed assets</button>
  </div>
  <div id="view"></div>
</main>

<div id="layers"></div>

function ring(pct,size){
  size = size || 44;
  const r = (size-6)/2, circ = 2*Math.PI*r, dash = (pct/100)*circ;
  const c = pct >= 80 ? "#3fb950" : pct >= 40 ? "#D4A843" : "#E8734A";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0" role="img" aria-label="${pct}% leverage">
    <g transform="rotate(-90 ${size/2} ${size/2})">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#30363d" stroke-width="5"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="5"
        stroke-dasharray="${dash} ${circ}" stroke-linecap="round" style="transition:stroke-dasharray .6s ease"/>
    </g>
    <text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" class="ring-t" fill="${c}">${pct}%</text>

}

    activity:[{id:"act0", type:"add", title:`Seeded ${assets.length} assets`, detail:"Initial platform asset registry", assetId:null, timestamp:Date.now()-86400000}],
    deployLog:[],
    sprint:{weekLabel:"Sprint "+new Date().toLocaleDateString("en-US",{month:"short",day:"2-digit"}), assetIds:assets.filter(a=>a.sprint).map(a=>a.id), isActive:true},
    seq:1,
  };
}
const ui = {
  tab:"pipeline", preview:null, previewTab:"details", modal:null, confirm:null,
  form:null, formErrors:{}, editId:null, spawnParentId:null,
  search:"", fType:"", fPillar:"", fStatus:"", fStage:"", fPri:"", fCat:"", fSpecial:"",
  sortField:"date", sortDir:"desc", selected:new Set(), uploadQueue:[], toast:null, deployUrl:"", noteEditId:null,
};

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw){
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.assets) && p.assets.length) return p;
    }
  } catch(e){ /* storage blocked or corrupt — fall through to seed */ }
  return freshState();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ /* quota or blocked — preview still works in-memory */ }
}
state = load();

/* ── mutations (mirror the Convex functions) ───────── */
function log(type,title,detail,assetId){
  state.activity.unshift({id:"act"+(state.seq++), type, title, detail:detail ?? "", assetId:assetId ?? null, timestamp:Date.now()});
  if (state.activity.length > 100) state.activity.length = 100;   // operations.addActivity prunes to 100
}
function toast(msg){
  ui.toast = msg;
  renderLayers();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { ui.toast = null; renderLayers(); }, 2800);
}
function commit(msg){ save(); render(); if (msg) toast(msg); }

function setStage(id,stage){
  const a = byId(id); if (!a || a.stage === stage) return;
  a.stage = stage;
  log("stage", `${a.assetId} → ${STAGE_META[stage].label}`, a.name, id);
  commit(`→ ${STAGE_META[stage].label}`);
}
function advance(id){
  const a = byId(id); if (!a) return;
  const n = nextStage(a.stage);
  if (!n) return toast("Already at the final stage");
  setStage(id,n);
}
function toggleStar(id){
  const a = byId(id); if (!a) return;
  a.starred = !a.starred;
  if (a.starred) log("star", `Starred: ${a.name}`, "", id);
  commit(a.starred ? "⭐ Starred" : "Unstarred");
}
/* Mirrors operations.addToSprint / removeFromSprint — keeps BOTH the boolean
   and the sprintWeek row in sync (assets.toggleSprint alone would desync them). */
function toggleSprint(id){
  const a = byId(id); if (!a) return;
  if (a.sprint){
    a.sprint = false;
    state.sprint.assetIds = state.sprint.assetIds.filter(x => x !== id);
    commit("Removed from sprint");
  } else {
    a.sprint = true;
    if (!state.sprint.assetIds.includes(id)) state.sprint.assetIds.push(id);
    log("add", `Sprint: ${a.name}`, "", id);
    commit("⚡ Added to sprint");
  }
}
function toggleMul(id,key){
  const a = byId(id); if (!a) return;
  a.multiplication[key] = !a.multiplication[key];
  if (a.multiplication[key]) log("edit", `Multiplied: ${a.assetId}`, `${key} ✓ (${mulScore(a.multiplication)}/6)`, id);
  commit("Saved");
}
/* Mirrors operations.addDeployEntry — side effect: sets deployUrl AND forces stage "live". */
function addDeploy(id,url){
  url = (url || "").trim(); if (!url) return;
  const a = byId(id); if (!a) return;
  state.deployLog.unshift({id:"d"+(state.seq++), assetId:id, url, note:"", deployedAt:Date.now()});
  a.deployUrl = url;
  a.stage = "live";
  log("deploy", "Deployed", url, id);
  ui.deployUrl = "";
  commit(`🚀 Deployed → ${url}`);
}
function removeAsset(id){
  const a = byId(id); if (!a) return;
  state.assets = state.assets.filter(x => x.id !== id);
  state.deployLog = state.deployLog.filter(d => d.assetId !== id);   // cascade, like assets.remove
  state.sprint.assetIds = state.sprint.assetIds.filter(x => x !== id);
  state.assets.forEach(x => { if (x.parentId === id) x.parentId = null; });
  ui.selected.delete(id);
  if (ui.preview === id) ui.preview = null;
  log("delete", `Deleted: ${a.name}`, a.assetId, null);
  commit(`🗑️ Deleted "${a.name}"`);
}
function nextAssetId(prefix){
  const nums = state.assets.filter(a => a.assetId.startsWith(prefix+"-"))
    .map(a => parseInt(a.assetId.split("-")[1] || "0", 10)).filter(n => !isNaN(n));
  return `${prefix}-${String(nums.length ? Math.max(...nums)+1 : 1).padStart(3,"0")}`;
}

/* ── filtering & sorting (client-side, as in the app) ─ */
function filtered(){
  const q = ui.search.trim().toLowerCase();
  const out = state.assets.filter(a => {
    if (q && !a.name.toLowerCase().includes(q) && !a.assetId.toLowerCase().includes(q) && !(a.notes||"").toLowerCase().includes(q)) return false;
    if (ui.fType && a.type !== ui.fType) return false;
    if (ui.fPillar && a.pillar !== ui.fPillar) return false;
    if (ui.fStatus && a.status !== ui.fStatus) return false;
    if (ui.fStage && a.stage !== ui.fStage) return false;
    if (ui.fPri && a.priority !== ui.fPri) return false;
    if (ui.fCat && a.category !== ui.fCat) return false;
    if (ui.fSpecial === "starred" && !a.starred) return false;
    if (ui.fSpecial === "sprint" && !a.sprint) return false;
    if (ui.fSpecial === "live" && a.stage !== "live") return false;
    return true;
  });
  const priOrder = {Critical:0,High:1,Medium:2,Low:3};
  const stgOrder = {converting:0,promoted:1,live:2,ready:3,draft:4};
  return out.sort((a,b) => {
    let av = a[ui.sortField], bv = b[ui.sortField];
    if (ui.sortField === "priority"){ av = priOrder[av] ?? 99; bv = priOrder[bv] ?? 99; }
    if (ui.sortField === "stage"){ av = stgOrder[av] ?? 99; bv = stgOrder[bv] ?? 99; }
    if (typeof av === "string" && typeof bv === "string") return ui.sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    return ui.sortDir === "asc" ? (av ?? 0)-(bv ?? 0) : (bv ?? 0)-(av ?? 0);
  });
}
function stats(){
  const all = state.assets;
  const mulDone = all.reduce((s,a) => s + mulScore(a.multiplication), 0);
  const stageCounts = {};
  STAGES.forEach(s => stageCounts[s] = 0);
  all.forEach(a => stageCounts[a.stage] = (stageCounts[a.stage] || 0) + 1);
  const catStats = {};
  all.forEach(a => {
    catStats[a.category] = catStats[a.category] || {count:0,kb:0,complete:0};
    catStats[a.category].count++;
    catStats[a.category].kb += a.kb;
    if (a.status === "Complete") catStats[a.category].complete++;
  });
  return {
    total:all.length,
    complete:all.filter(a => a.status === "Complete").length,
    inProgress:all.filter(a => a.status === "In Progress").length,
    critical:all.filter(a => a.priority === "Critical").length,
    starred:all.filter(a => a.starred).length,
    sprint:all.filter(a => a.sprint).length,
    totalKb:all.reduce((s,a) => s+a.kb, 0),
    liveCount:stageCounts.live || 0,
    converting:stageCounts.converting || 0,
    leveragePct: all.length ? Math.round((mulDone/(all.length*6))*100) : 0,
    stageCounts, catStats,
  };
}

/* ── drag & drop ───────────────────────────────────── */
let dragId = null;
function wireDnD(){
  document.querySelectorAll(".acard").forEach(el => {
    el.addEventListener("dragstart", e => {
      dragId = el.dataset.id;
      el.classList.add("drag");
      e.dataTransfer.effectAllowed = "move";
      // Carry the id in the payload too — the closure alone is not reliable
      // once dragend races the drop across browsers.
      try { e.dataTransfer.setData("text/plain", dragId); } catch(err){}
    });
    el.addEventListener("dragend", () => { el.classList.remove("drag"); });
  });
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("over"); });
    col.addEventListener("dragleave", e => { if (!col.contains(e.relatedTarget)) col.classList.remove("over"); });
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("over");
      let id = "";
      try { id = e.dataTransfer.getData("text/plain"); } catch(err){}
      id = id || dragId;
      dragId = null;
      if (id) setStage(id, col.dataset.stage);
    });
  });
}

    log("edit", `Edited: ${a.name}`, `Stage: ${a.stage}`, a.id);
    ui.modal = null; ui.form = null; ui.editId = null;
    commit(`✓ Updated "${a.name}"`);
  } else {
    const a = {
      id:"a"+(state.seq++), assetId:f.assetId, name:f.name, type:f.type, category:f.category,
      pillar:f.pillar || "Multi-Pillar", status:f.status || "In Progress", stage:f.stage || "draft",
      priority:f.priority || "High", date:f.date, kb:Number(f.kb) || 0, notes:f.notes || "",
      code:f.code || "", deployUrl:f.deployUrl || "", starred:false, sprint:false,
      parentId: ui.spawnParentId || null, revenueTag:[],
      multiplication:{newsletter:false,blog:false,video:false,leadMagnet:false,courseModule:false,landingPage:false},
    };
    state.assets.push(a);
    log("add", `Added: ${a.name}`, `Type: ${a.type}`, a.id);
    ui.modal = null; ui.form = null; ui.spawnParentId = null;
    commit(`✓ Added "${a.name}"`);
  }
}

/* ── export ────────────────────────────────────────── */
/* Hosted views hand files to the viewer through the downloads capability;
   a plain blob link is inert there. Opened as a local file, fall back to it. */
const downloadsReady = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("downloads").catch(() => null)
  : Promise.resolve(null);

function blobDownload(name, text, mime){
  const url = URL.createObjectURL(new Blob([text],{type:mime}));
  const el = document.createElement("a");
  el.href = url; el.download = name; document.body.appendChild(el); el.click();
  el.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function offerFile(name, text, mime, okMsg){
  const d = await downloadsReady;
  if (d){
    try { await d.save({filename:name, data:text}); return toast(okMsg); }
    catch(err){
      const code = err && err.code;
      if (code === "declined") return toast("Save cancelled");
      if (code === "rate_limited") return toast("A save prompt is already open");
      if (code === "extension_not_enabled" && name.endsWith(".csv")){
        try { await d.save({filename:name.replace(/\.csv$/,".txt"), data:text}); return toast(okMsg+" (as .txt)"); }
        catch(e2){ if (e2 && e2.code === "declined") return toast("Save cancelled"); }
      }
      return toast("Couldn't save the file here");
    }
  }
  blobDownload(name, text, mime);
  toast(okMsg);
}
function exportJSON(){
  const data = state.assets.map(({code, id, ...rest}) => rest);   // code stripped, as in the app
  offerFile(`mmm-assets-${Date.now()}.json`, JSON.stringify(data,null,2), "application/json", "📦 JSON exported");
}
function exportCSV(){
  const cols = ["assetId","name","type","category","pillar","status","stage","priority","date","kb","notes","deployUrl"];
  const rows = [cols.join(","), ...state.assets.map(a => cols.map(c => `"${String(a[c] ?? "").replace(/"/g,'""')}"`).join(","))];
  offerFile(`mmm-assets-${Date.now()}.csv`, rows.join("\n"), "text/csv", "📊 CSV exported");
}

/* ── events ────────────────────────────────────────── */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  switch(act){
    case "tab": ui.tab = el.dataset.tab; ui.selected.clear(); render(); break;
    case "open": ui.preview = id; ui.previewTab = "details"; ui.deployUrl = ""; renderLayers(); break;
    case "close-drawer": ui.preview = null; renderLayers(); break;
    case "dr-tab": ui.previewTab = el.dataset.t; renderLayers(); break;
    case "star": toggleStar(id); break;
    case "sprint": toggleSprint(id); break;
    case "advance": advance(id); break;
    case "set-stage": setStage(id, el.dataset.stage); break;
    case "mul": toggleMul(id, el.dataset.key); break;
    case "new": openForm(null,null,null); break;
    case "edit": openForm(id,null,null); break;
    case "save": saveForm(); break;
    case "close-modal": ui.modal = null; ui.form = null; ui.editId = null; ui.spawnParentId = null; render(); break;
    case "close-modal-bg": if (e.target.classList.contains("modal-w")){ ui.modal = null; ui.form = null; ui.editId = null; render(); } break;
    case "deploy": {
      const inp = document.getElementById("deploy-in");
      addDeploy(id, inp ? inp.value : "");
      break;
    }
    case "del": {
      const a = byId(id);
      ui.confirm = {msg:`Delete "${a.name}" (${a.assetId})? This cannot be undone.`, run:() => removeAsset(id)};
      renderLayers(); break;
    }
    case "confirm-yes": { const c = ui.confirm; ui.confirm = null; if (c) c.run(); else renderLayers(); break; }
    case "confirm-no": ui.confirm = null; renderLayers(); break;
    case "sort":
      if (ui.sortField === el.dataset.field) ui.sortDir = ui.sortDir === "asc" ? "desc" : "asc";
      else { ui.sortField = el.dataset.field; ui.sortDir = "asc"; }
      render(); break;
    case "sel": ui.selected.has(id) ? ui.selected.delete(id) : ui.selected.add(id); render(); break;
    case "sel-all": {
      const rows = filtered();
      const all = rows.length && rows.every(a => ui.selected.has(a.id));
      all ? ui.selected.clear() : rows.forEach(a => ui.selected.add(a.id));
      render(); break;
    }
    case "bulk-clear": ui.selected.clear(); render(); break;
    case "bulk-del": {
      const n = ui.selected.size;
      ui.confirm = {msg:`Delete ${n} selected asset${n>1?"s":""}? This cannot be undone.`, run:() => {
        [...ui.selected].forEach(sid => {
          const a = byId(sid); if (!a) return;
          state.assets = state.assets.filter(x => x.id !== sid);
          state.deployLog = state.deployLog.filter(d => d.assetId !== sid);
          state.sprint.assetIds = state.sprint.assetIds.filter(x => x !== sid);
        });
        log("delete", `Deleted ${n} assets`, "Bulk operation", null);
        ui.selected.clear();
        commit(`🗑️ Deleted ${n} assets`);
      }};
      renderLayers(); break;
    }
    case "clear-filters":
      ui.search = ""; ui.fType = ui.fPillar = ui.fStatus = ui.fStage = ui.fPri = ui.fCat = ui.fSpecial = "";
      render(); break;
    case "clear-sprint":
      state.assets.forEach(a => a.sprint = false);
      state.sprint.assetIds = [];
      commit("Sprint cleared"); break;
    case "clear-act": state.activity = []; commit("Activity log cleared"); break;
    case "edit-note": ui.noteEditId = id; render(); document.getElementById("note-in")?.focus(); break;
    case "queue-add": {
      const f = ui.uploadQueue[+el.dataset.i];
      if (f) openForm(null, null, {name:f.name, type:f.type, kb:f.kb, code:f.code});
      break;
    }
    case "queue-del": ui.uploadQueue.splice(+el.dataset.i,1); render(); break;
    case "export-json": exportJSON(); break;
    case "export-csv": exportCSV(); break;
    case "reset":
      ui.confirm = {msg:"Discard all changes and restore the 47 seed assets?", run:() => {
        state = freshState(); ui.selected.clear(); ui.preview = null; commit("Reset to seed data");
      }};
      renderLayers(); break;
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "search"){ ui.search = t.value; render(); return; }
  if (t.dataset.f){ ui[t.dataset.f] = t.value; render(); return; }
  if (t.dataset.k && ui.form){ ui.form[t.dataset.k] = t.value; return; }
  if (t.id === "deploy-in"){ ui.deployUrl = t.value; return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  const act = t.dataset.act;
  if (act === "bulk-stage" && t.value){
    [...ui.selected].forEach(id => { const a = byId(id); if (a) a.stage = t.value; });
    log("stage", `Bulk stage → ${STAGE_META[t.value].label}`, `${ui.selected.size} assets`, null);
    commit(`→ ${STAGE_META[t.value].label} for ${ui.selected.size} assets`);
  }
  if (act === "bulk-status" && t.value){
    [...ui.selected].forEach(id => { const a = byId(id); if (a) a.status = t.value; });
    log("edit", `Bulk status → ${t.value}`, `${ui.selected.size} assets`, null);
    commit(`Status set for ${ui.selected.size} assets`);
  }
  if (act === "bulk-pri" && t.value){
    [...ui.selected].forEach(id => { const a = byId(id); if (a) a.priority = t.value; });
    log("edit", `Bulk priority → ${t.value}`, `${ui.selected.size} assets`, null);
    commit(`Priority set for ${ui.selected.size} assets`);
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "note-in" && (e.key === "Enter" || e.key === "Escape")){
    const a = byId(e.target.dataset.id);
    if (a && e.key === "Enter"){ a.notes = e.target.value; ui.noteEditId = null; commit("✓ Note saved"); }
    else { ui.noteEditId = null; render(); }
    return;
  }
  if (e.target.id === "deploy-in" && e.key === "Enter"){
    const btn = document.querySelector('[data-act="deploy"]');
    if (btn) addDeploy(btn.dataset.id, e.target.value);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "k"){
    e.preventDefault();
    if (!["pipeline","registry","multiply"].includes(ui.tab)){ ui.tab = "registry"; render(); }
    document.getElementById("search")?.focus();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "n"){ e.preventDefault(); openForm(null,null,null); }
  if (e.key === "Escape"){
    if (ui.confirm){ ui.confirm = null; renderLayers(); }
    else if (ui.modal){ ui.modal = null; ui.form = null; ui.editId = null; render(); }
    else if (ui.preview){ ui.preview = null; renderLayers(); }
  }
});

/* ── uploads (browser-local only) ──────────────────── */
function handleFiles(files){
  if (!files || !files.length) return;
  const typeMap = {md:"MD",jsx:"JSX",tsx:"TSX",html:"HTML",xlsx:"XLSX",pdf:"PDF",json:"JSON",csv:"XLSX",txt:"TXT",docx:"MD"};
  [...files].forEach(file => {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    const type = typeMap[ext] ?? "TXT";
    const kb = Math.ceil(file.size/1024);
    const name = file.name.replace(/\.[^.]+$/, "");
    if (["md","html","jsx","tsx","json","txt","csv"].includes(ext)){
      const r = new FileReader();
      r.onload = ev => { ui.uploadQueue.push({name,kb,type,code:String(ev.target.result || "").slice(0,20000)}); render(); };
      r.readAsText(file);
    } else {
      ui.uploadQueue.push({name,kb,type,code:""});
    }
    log("upload", `Uploaded: ${file.name}`, `${kb} KB`, null);
  });
  commit(`✓ ${files.length} file(s) queued`);
}
document.addEventListener("change", e => { if (e.target.id === "file-in") handleFiles(e.target.files); });
document.addEventListener("dragover", e => { if (e.target.closest("#drop")){ e.preventDefault(); e.target.closest("#drop").classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => {
  const d = e.target.closest("#drop");
  if (d){ e.preventDefault(); d.classList.remove("over"); handleFiles(e.dataTransfer.files); }
});

render();
</script>
