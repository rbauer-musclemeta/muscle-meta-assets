<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muscle-Meta Hero Static</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Muscle-Meta hero, static (no motion, no JavaScript) =====
   EDIT COPY: change the text inside the elements marked data-copy in the <section> below.
   Brand tokens are the CSS variables in :root. */
:root{
  --teal-1:#077D85; --teal-2:#0E979B; --teal-3:#2FB0B0; --teal-4:#58C6C3;
  --cream:#FBF5E6; --cream-soft:#E6F7F2; --coral:#F8938A; --gold:#E8B64C; --ink-btn:#04474D;
}
*{box-sizing:border-box}
body{margin:0}
.mm-hero{position:relative;width:100%;min-height:520px;overflow:hidden;font-family:'Figtree',system-ui,sans-serif;
  background:linear-gradient(100deg,var(--teal-1) 0%,var(--teal-2) 48%,var(--teal-3) 74%,var(--teal-4) 100%);
  display:flex;align-items:center}
.mm-grid{position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 1px,transparent 1px 56px),repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 1px,transparent 1px 56px)}
.mm-radar{position:absolute;right:max(2vw,0px);top:50%;width:540px;height:460px;margin-top:-230px;pointer-events:none}
.mm-glow{position:absolute;left:-30px;top:-70px;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(190,248,240,.6) 0%,rgba(190,248,240,0) 62%)}
.mm-clip{position:absolute;left:50px;top:10px;width:440px;height:440px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.mm-sweep{position:absolute;inset:-80px;transform:rotate(40deg);
  background:conic-gradient(from 0deg,rgba(251,245,230,0) 0deg,rgba(251,245,230,0) 250deg,rgba(251,245,230,.05) 300deg,rgba(251,245,230,.3) 360deg)}
.mm-radar svg{position:absolute;inset:0}
.mm-dots{position:absolute;inset:0;pointer-events:none}
.mm-dot{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#FFD0C9,var(--coral) 62%);box-shadow:0 0 10px 2px rgba(248,147,138,.5)}
.mm-copy{position:relative;z-index:2;padding:48px max(5vw,24px);max-width:820px;color:var(--cream)}
.mm-title{margin:0;display:flex;flex-direction:column}
.mm-title .l1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(56px,7.2vw,104px);line-height:1;letter-spacing:-1.5px}
.mm-title .l1 sup{font-size:.35em;font-weight:500;vertical-align:top;position:relative;top:.2em;margin-left:4px;letter-spacing:0}
.mm-title .l2{font-weight:600;font-size:clamp(40px,5.3vw,76px);line-height:1.1;letter-spacing:-1px}
.mm-sub{margin:22px 0 0;max-width:460px;font-size:20px;line-height:1.5;color:var(--cream-soft)}
.mm-cta{margin-top:30px;display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 28px;border-radius:999px;
  background:var(--gold);color:var(--ink-btn);font-weight:700;font-size:17px;text-decoration:none}
.mm-cta:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
@media (max-width:900px){
  .mm-radar{opacity:.5;right:-160px}
  .mm-hero{min-height:560px}
}
</style>
</head>
<body>

<section class="mm-hero">
  <div class="mm-grid" aria-hidden="true"></div>

  <div class="mm-radar" aria-hidden="true">
    <div class="mm-glow"></div>
    <div class="mm-clip"><div class="mm-sweep"></div></div>
    <svg width="540" height="460" viewBox="-270 -230 540 460" fill="none">
      <g stroke="rgba(251,245,230,.5)" stroke-width="1.5">
        <path d="M0 -220 L220 0 L0 220 L-220 0 Z"/>
        <path d="M0 -158 L158 0 L0 158 L-158 0 Z" stroke-opacity=".8"/>
        <path d="M0 -100 L100 0 L0 100 L-100 0 Z" stroke-opacity=".9"/>
        <path d="M0 -56 L56 0 L0 56 L-56 0 Z"/>
      </g>
      <path d="M0 -220 V220 M-220 0 H220" stroke="rgba(251,245,230,.18)" stroke-width="1"/>
      <circle r="14" fill="#F8938A" fill-opacity=".25"/>
      <circle r="7" fill="#F8938A"/>
    </svg>
  </div>

  <div class="mm-dots" aria-hidden="true">
    <span class="mm-dot" style="left:7.8%;top:9%;width:9px;height:9px"></span>
    <span class="mm-dot" style="left:2.6%;top:18%;width:7px;height:7px;opacity:.7"></span>
    <span class="mm-dot" style="left:39.6%;top:17%;width:6px;height:6px;opacity:.8"></span>
    <span class="mm-dot" style="left:4.2%;top:78%;width:8px;height:8px"></span>
    <span class="mm-dot" style="left:30.6%;top:77%;width:8px;height:8px;opacity:.75"></span>
    <span class="mm-dot" style="left:51.9%;top:84%;width:8px;height:8px;opacity:.85"></span>
    <span class="mm-dot" style="left:22.2%;top:90%;width:5px;height:5px;opacity:.6"></span>
    <span class="mm-dot" style="left:48.6%;top:6%;width:5px;height:5px;opacity:.6"></span>
    <span class="mm-dot" style="left:96.5%;top:90%;width:6px;height:6px;opacity:.8"></span>
    <span class="mm-dot" style="left:70.1%;top:8%;width:5px;height:5px;opacity:.7"></span>
    <span class="mm-dot" style="left:16%;top:25%;width:5px;height:5px;opacity:.6"></span>
    <span class="mm-dot" style="left:42.4%;top:58%;width:6px;height:6px;opacity:.9"></span>
    <span class="mm-dot" style="left:57%;top:48%;width:6px;height:6px;opacity:.7"></span>
    <span class="mm-dot" style="left:12.5%;top:92%;width:5px;height:5px;opacity:.6"></span>
    <span class="mm-dot" style="left:62.5%;top:92%;width:6px;height:6px;opacity:.8"></span>
    <span class="mm-dot" style="left:98.6%;top:8%;width:6px;height:6px;opacity:.85"></span>
    <span class="mm-dot" style="left:87.9%;top:16%;width:10px;height:10px"></span>
    <span class="mm-dot" style="left:97.9%;top:41%;width:8px;height:8px;opacity:.9"></span>
    <span class="mm-dot" style="left:92%;top:76%;width:11px;height:11px"></span>
    <span class="mm-dot" style="left:67.8%;top:93%;width:8px;height:8px;opacity:.7"></span>
    <span class="mm-dot" style="left:71.2%;top:65%;width:7px;height:7px;opacity:.85"></span>
    <span class="mm-dot" style="left:58.8%;top:65%;width:8px;height:8px;opacity:.75"></span>
    <span class="mm-dot" style="left:65%;top:28%;width:8px;height:8px;opacity:.9"></span>
    <span class="mm-dot" style="left:82%;top:33%;width:7px;height:7px;opacity:.8"></span>
    <span class="mm-dot" style="left:76.8%;top:10%;width:6px;height:6px;opacity:.7"></span>
    <span class="mm-dot" style="left:63.4%;top:51%;width:6px;height:6px;opacity:.65"></span>
  </div>

  <!-- ===== EDITABLE COPY ===== -->
  <div class="mm-copy">
    <h1 class="mm-title">
      <span class="l1" data-copy="headline">Muscle-Meta<sup>™</sup></span>
      <span class="l2" data-copy="subhead">Pulse Check</span>
    </h1>
    <p class="mm-sub" data-copy="body">A quick read on where your muscle and metabolism stand today.</p>
    <a class="mm-cta" href="#start" data-copy="button">
      <span>Start your Pulse Check</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#04474D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</section>

</body>
</html>
